[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptum-security"
version = "0.1.0"
description = "Framework-independent Level 7 and 8 LLM CTF guardrails"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx==0.28.1", "pydantic==2.12.5", "PyYAML==6.0.3", "python-dotenv==1.2.4",
]

[project.optional-dependencies]
ml = ["torch==2.9.1", "transformers==4.57.6", "sentencepiece==0.2.1", "protobuf==6.33.5"]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.14", "psutil==7.2.2"]

[tool.setuptools.packages.find]
include = ["security*"]
exclude = ["security.tests*"]

[tool.setuptools.package-data]
security = ["config/*.yaml", "evaluation/*.json"]

[tool.pytest.ini_options]
testpaths = ["security/tests"]
asyncio_mode = "auto"
markers = ["integration: requires downloaded classifiers or local Ollama"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "ml", marker = "sys_platform == 'linux'" }]

[tool.uv]
# Validate wheel availability for the platforms with upstream ML wheels.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
